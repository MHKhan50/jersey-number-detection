[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jersey-detect"
version = "1.0.0"
description = "Single-object jersey detector: bounding box and presence of jersey number '0', trained from scratch with a small CNN."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muzammal Hussain" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
train = ["torch>=2.2"]
dev = ["torch>=2.2", "pytest>=8.0", "ruff>=0.5"]

[project.scripts]
jersey-detect = "jersey_detect.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
