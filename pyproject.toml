[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jersey-detect"
version = "2.1.0"
description = "Jersey-number localisation in sports images: a from-scratch anchor-free detector, baselines and COCO-style evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muzammal Hussain" }]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.1",
]

[project.optional-dependencies]
train = ["torch>=2.3"]
dev = [
    "torch>=2.3",
    "pytest>=8.0",
    "ruff>=0.5",
    "pycocotools>=2.0.7",
    "nbformat>=5.9",
    "nbclient>=0.10",
    "ipykernel>=6.29",
]

[project.scripts]
jersey-detect = "jersey_detect.cli:main"

[project.urls]
Repository = "https://github.com/MHKhan50/jersey-number-detection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
