name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU PyTorch
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and dev tools
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check --output-format=github src tests
      - name: Test
        if: success() || failure()
        run: |
          rc=0; pytest -q -rs > pytest.log 2>&1 || rc=$?
          cat pytest.log
          echo "::notice title=pytest ${{ matrix.python-version }}::$(tail -n 1 pytest.log)"
          grep '^SKIPPED' pytest.log | while read -r line; do echo "::notice title=skip::$line"; done
          grep -E '^(FAILED|ERROR|E  )' pytest.log | head -40 | while read -r line; do echo "::error::$line"; done
          exit $rc
      - name: Run the Kaggle notebook end to end (synthetic data)
        if: (success() || failure()) && matrix.python-version == '3.12'
        env:
          RUN_NOTEBOOK: "1"
        run: |
          rc=0; pytest -q -rs tests/test_notebook.py -k end_to_end > nb.log 2>&1 || rc=$?
          cat nb.log
          echo "::notice title=notebook::$(tail -n 1 nb.log)"
          grep -E '^(FAILED|ERROR|E  )' nb.log | head -40 | while read -r line; do echo "::error::$line"; done
          exit $rc

      - name: Learning check (short CPU training on synthetic data)
        if: (success() || failure()) && matrix.python-version == '3.12'
        env:
          RUN_SLOW: "1"
        run: |
          rc=0; pytest -q -s -rs tests/test_learning.py > learn.log 2>&1 || rc=$?
          cat learn.log
          echo "::notice title=learning::$(grep LEARNING_CHECK learn.log | tail -n 1) $(tail -n 1 learn.log)"
          grep -E '^(FAILED|ERROR|E  )' learn.log | head -40 | while read -r line; do echo "::error::$line"; done
          exit $rc
      - name: YOLO baseline smoke test (Ultralytics, synthetic data)
        if: (success() || failure()) && matrix.python-version == '3.12'
        env:
          RUN_YOLO: "1"
        run: |
          pip install "ultralytics>=8.3"
          rc=0; pytest -q -rs tests/test_yolo_baseline.py tests/test_notebook.py -k yolo > yolo.log 2>&1 || rc=$?
          cat yolo.log
          echo "::notice title=yolo::$(tail -n 1 yolo.log)"
          grep -E '^(FAILED|ERROR|E  )' yolo.log | head -40 | while read -r line; do echo "::error::$line"; done
          exit $rc
